name: Deploy Expense Frontend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build frontend
      - name: Build frontend
        run: npm run build

      # 5. Create tar.gz
      - name: Create deployment archive
        run: |
          tar -czf admin-wayabroad-frontend-build.tar.gz -C dist .

      # 6. Upload build to EC2
      - name: Upload build to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "admin-wayabroad-frontend-build.tar.gz"
          target: "/home/ec2-user/"

      # 7. Deploy on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            set -e

            echo "Extracting frontend..."

            sudo tar -xzf \
              /home/ec2-user/admin-wayabroad-frontend-build.tar.gz \
              -C /var/www/wayAbroad-admin-frontend

            echo "Setting ownership..."

            sudo chown -R nginx:nginx \
              /var/www/wayAbroad-admin-frontend

            echo "Testing Nginx configuration..."

            sudo nginx -t

            echo "Reloading Nginx..."

            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
